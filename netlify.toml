[build]
  command = "pnpm install && pnpm build"
  publish = "dist/public"

[functions]
  node_bundler = "esbuild"

# Edge Function: inject correct SEO meta tags per-route into the HTML
[[edge_functions]]
  function = "inject-meta"
  path = "/*"

[[redirects]]
  from = "/api/*"
  to = "https://hvac-campaigns-essex-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/google-ads-import.csv"
  to = "/google-ads-import.csv"
  status = 200
  force = true

[[redirects]]
  from = "/247-partners.html"
  to = "/247-partners.html"
  status = 200
  force = true

# ── Terms of service: bare /terms always points at the newest version.
# 302 (not 301) because the target moves when a new version publishes. ──
[[redirects]]
  from = "/terms"
  to = "/terms/v1.0"
  status = 302
  force = true

# The terms page is UNLISTED: publicly reachable via a direct proposal link,
# but kept out of search indexes. Belt-and-suspenders with the page's noindex
# meta tag, robots.txt Disallow: /terms/, and its absence from sitemap.xml.
[[headers]]
  for = "/terms/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# ── 301 Redirects for old/renamed URLs (GSC redirect validation fixes) ──
[[redirects]]
  from = "/blog/how-to-apply-pseg-rebate-nj"
  to = "/blog/pseg-rebate-application-process"
  status = 301
  force = true

[[redirects]]
